      --grad-top-stop-color-0: transparent;
      --grad-top-stop-color-100: transparent;
      --stroke: transparent;
      --grad-bottom-stop-color-0: transparent;
      --grad-bottom-stop-color-100: transparent;
      --top-bottom-half-stroke-width: 1;
      --text-stroke-width: 0.5;
      --text-fill: transparent;
      --shadow-flood-color: transparent;
      --shadow-flood-opacity: 0.4;
      --background-field-fill: currentColor;
    }

    #top-half {
      fill: url(#grad-top);
      stroke: var(--stroke);
      stroke-width: var(--top-bottom-half-stroke-width);
      filter: url(#shadow);
    }
    #bottom-half {
      fill: url(#grad-bottom);
      stroke: var(--stroke);
      stroke-width: var(--top-bottom-half-stroke-width);
      filter: url(#shadow);
    }
    #text {
      fill: var(--text-fill);
      stroke: var(--stroke);
      stroke-width: var(--text-stroke-width);
      filter: url(#shadow);
    }
  </style>
  <defs>
    <linearGradient id="grad-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:var(--grad-top-stop-color-0);stop-opacity:1" />
      <stop offset="100%" style="stop-color:var(--grad-top-stop-color-100);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-bottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:var(--grad-bottom-stop-color-0);stop-opacity:1" />
      <stop offset="100%" style="stop-color:var(--grad-bottom-stop-color-100);stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="-4" stdDeviation="4" flood-color="var(--shadow-flood-color)" flood-opacity="var(--shadow-flood-opacity)" />
