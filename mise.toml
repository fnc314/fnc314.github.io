monorepo_root = true

[monorepo]
  lockfile = true
  config_roots = [
    "configs/@pwrs-cem",
    "configs/custom-elements-manifest",
    "configs/eslint",
    "configs/mise",
    "configs/postcss",
    "configs/prettier",
    "configs/typedoc",
    "configs/typescript",
    "firebase/functions/node",
    "packages/components",
    "packages/data",
    "packages/design-tokens",
    "packages/services",
    "packages/types",
    "sites/docs",
    "sites/portfolio",
  ]

[tools]
  firebase = "15.28.2"
  node = "26.8.1"
  npm = "12.0.2"
  pnpm = "12.1.0"
  tombi = "1.5.0"
  usage = "6.6.1"

[deps]
  pnpm = {
    auto = false,
    description = "Force `mise` to invoke `pnpm install`",
    run = "pnpm install --force -w -r --loglevel debug",
    outputs = [
      "node_modules",
    ],
    sources = [
      "pnpm-workspace.yaml",
    ]
  }

[env]
  _ = {
    path = [
      {
        path = [
          "{{config_root}}/node_modules/.bin",
        ],
        tools = true,
      }
    ],
  }
  configureExtensionsUseSymLinks = true
  LOCAL_CONFIG_DIR = "{{config_root}}/.config"
  LOCAL_BUILD_PYTHON_SERVER_PORT = "9100"
  BUILD_ENVIRONMENT = ""
  LOCAL_BUILD_PYTHON_SERVER_DIR = "dist/vite/development"
  RUST_BACKTRACE = "full"

[settings]
  status = {
    show_tools = true,
    truncate = false,
  }
  auto_env = true
  task = {
    show_full_cmd = true,
  }
  npm = {
    package_manager = "pnpm",
  }
  node = {
    corepack = true,
  }
  color = true
  env_shell_expand = true
  terminal_progress = true
  color_theme = "dracula"
  experimental = true
  env_file = ".env/.env"
